name: TestHost
options:
  bundleIdPrefix: com.superwall.nativeislands
  deploymentTarget:
    iOS: "16.0"
packages:
  NativeIslands:
    path: ../..
targets:
  TestHost:
    type: application
    platform: iOS
    sources:
      - TestHost
    dependencies:
      - package: NativeIslands
        product: NativeIslands
      - package: NativeIslands
        product: NativeIslandsComponents
    preBuildScripts:
      - name: Bundle the test pages
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          PAGES="$SRCROOT/../pages"
          if command -v bun >/dev/null; then
            (cd "$SRCROOT/../.." && bun install --frozen-lockfile >/dev/null)
            bun run --cwd "$PAGES" build >/dev/null
          elif [ ! -f "$PAGES/dist/index.html" ]; then
            echo "error: install bun, or build the pages first: bun run --cwd tests/pages build"
            exit 1
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/pages"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$PAGES/dist/" "$DEST/"
    info:
      path: TestHost/Info.plist
      properties:
        CFBundleDisplayName: Island Tests
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  TestHostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TestHostUITests
    dependencies:
      - target: TestHost
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TestHost:
    build:
      targets:
        TestHost: all
        TestHostUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TestHostUITests
