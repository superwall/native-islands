name: CI

on:
  pull_request:
  push:
    branches: [main]

# The iOS tests live in ios.yml and run only when started by hand.
#
# A new push to a PR cancels that PR's older run. Pushes to main each get their own group (by commit), so none is ever
# cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx oxlint --deny-warnings packages/web tests/pages examples/showcase performance
      - run: bunx oxfmt --check packages/web tests examples performance
      - run: bun run --cwd packages/web typecheck
      - run: bun run --cwd packages/web test:coverage
      - run: bun run --cwd packages/web build
      - run: bunx publint packages/web --strict
      - run: cd packages/web && bunx @arethetypeswrong/cli --pack . --profile esm-only --exclude-entrypoints components.css
      - run: scripts/pack-smoke.sh
      - run: bun test performance
      - run: bunx oxlint --deny-warnings skills
      - run: bunx oxfmt --check skills
      - run: bun test skills
      - run: bun run --cwd tests/pages build
      - run: cd examples/showcase && bun test --conditions source test
      - run: bun run --cwd examples/showcase build

  # Xcode 27 accepts some type conversions that Xcode 26 rejects, so the package
  # and its tests are built with the oldest and newest Xcode 26 as well. 26.2 is
  # the oldest Xcode the image has an iOS simulator runtime for: 26.0.1 and
  # 26.1.1 cannot resolve a simulator destination there. Intel runners start at
  # once, and a build without running tests is fine at their speed.
  swift-xcode26:
    runs-on: macos-26-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.6"]
    name: swift (Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      # The build takes 2 to 4 minutes. A hung xcodebuild fails here, which
      # keeps its log; the job's own timeout cancels it and loses the log.
      - timeout-minutes: 10
        run: xcodebuild build-for-testing -scheme NativeIslands-Package -destination 'generic/platform=iOS Simulator' -quiet
