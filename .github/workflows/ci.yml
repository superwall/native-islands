name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx oxlint --deny-warnings packages/web tests/pages examples/showcase performance
      - run: bunx oxfmt --check packages/web tests examples performance
      - run: bun run --cwd packages/web typecheck
      - run: bun run --cwd packages/web test:coverage
      - run: bun test performance
      - run: bun run --cwd tests/pages build
      - run: cd examples/showcase && bun test test
      - run: bun run --cwd examples/showcase build

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --quiet --strict packages/swift tests/ios examples/ios
      - name: Swift tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone")))')
          xcodebuild test -scheme NativeIslands -destination "id=$DEVICE" -resultBundlePath build/swift-tests.xcresult -quiet
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: swift-test-results
          path: build/swift-tests.xcresult
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: brew install xcodegen
      - name: Test host app
        run: |
          bun install --frozen-lockfile
          cd tests/ios && xcodegen -q
          xcodebuild build -project TestHost.xcodeproj -scheme TestHost -destination 'generic/platform=iOS Simulator' -quiet
      - name: Islands app
        run: |
          cd examples/ios && xcodegen -q
          xcodebuild build -project Islands.xcodeproj -scheme Islands -destination 'generic/platform=iOS Simulator' -quiet

  alignment:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: brew install xcodegen
      - run: bun install --frozen-lockfile
      - name: Islands sit on their web elements
        run: scripts/ui-tests.sh --devices "iPhone 17" --only AlignmentUITests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: alignment-results
          path: build/ui-tests/results.xcresult
