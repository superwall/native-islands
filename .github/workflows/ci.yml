name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bunx oxlint js
      - run: bunx oxfmt --check js contract
      - run: bun run --cwd js typecheck
      - run: bun run --cwd js test:coverage

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --quiet --strict Sources Tests
      - name: Swift tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone")))')
          xcodebuild test -scheme NativeIslands -destination "id=$DEVICE" -quiet
