name: CI

on:
  pull_request:
  push:
    branches: [main]

# The iOS tests live in ios.yml and run only when started by hand.
#
# A new push to a PR cancels that PR's older run. Pushes to main each get their own group (by commit), so none is ever
# cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx oxlint --deny-warnings packages/web tests/pages examples/showcase performance
      - run: bunx oxfmt --check packages/web tests examples performance
      - run: bun run --cwd packages/web typecheck
      - run: bun run --cwd packages/web test:coverage
      - run: bun run --cwd packages/web build
      - run: bunx publint packages/web --strict
      - run: cd packages/web && bunx @arethetypeswrong/cli --pack . --profile esm-only --exclude-entrypoints components.css
      - run: scripts/pack-smoke.sh
      - run: bun test performance
      - run: bun run --cwd tests/pages build
      - run: cd examples/showcase && bun test --conditions source test
      - run: bun run --cwd examples/showcase build
