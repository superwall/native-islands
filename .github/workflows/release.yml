name: Release

# Pushing a tag like v0.1.0 releases that version: the npm package, then the
# GitHub release. Swift Package Manager reads the tag itself, and CocoaPods
# users point their Podfile at it, so there is nothing to push for the app side.
# Each step skips what is already out, so a failed run can be started again on
# the tag.
#
# npm publishes through trusted publishing: npm trusts this workflow file in
# this repository, so there is no token to store. The package's settings on
# npmjs.com name it under Trusted Publisher.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/release-check.sh "$GITHUB_REF_NAME"

  npm:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - run: bunx publint packages/web --strict
      - name: Publish native-islands
        working-directory: packages/web
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$(npm view "native-islands@$version" version 2>/dev/null)" == "$version" ]]; then
            echo "native-islands@$version is already on npm"
            exit 0
          fi
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          npm publish --access public --tag "$tag"

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release"
            exit 0
          fi
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}"
