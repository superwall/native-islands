name: Islands
options:
  bundleIdPrefix: com.superwall.nativeislands
  deploymentTarget:
    iOS: "26.0"
packages:
  NativeIslands:
    path: ../..
targets:
  Islands:
    type: application
    platform: iOS
    sources:
      - Islands
    dependencies:
      - package: NativeIslands
    preBuildScripts:
      - name: Bundle the showcase
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          PAGES="$SRCROOT/../showcase"
          if command -v bun >/dev/null; then
            (cd "$SRCROOT/../.." && bun install --frozen-lockfile >/dev/null)
            bun run --cwd "$PAGES" build >/dev/null
          elif [ ! -f "$PAGES/dist/index.html" ]; then
            echo "error: install bun, or build the showcase first: bun run --cwd examples/showcase build"
            exit 1
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/pages"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$PAGES/dist/" "$DEST/"
    info:
      path: Islands/Info.plist
      properties:
        CFBundleDisplayName: Islands
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  Islands:
    build:
      targets:
        Islands: all
    run:
      config: Debug
